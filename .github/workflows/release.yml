name: Release asset

# Attaches a zip of the integration folder to every published release.
# HACS downloads this file (hacs.json: zip_release + filename), and GitHub
# counts the asset downloads, which HACS shows as the download number.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build ich_tanke_strom.zip (integration files at the archive root)
        run: |
          cd custom_components/ich_tanke_strom
          zip -r ../../ich_tanke_strom.zip . -x '*/__pycache__/*' '*.pyc'
          cd ../..
          unzip -l ich_tanke_strom.zip | head -20

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ich_tanke_strom.zip --clobber
